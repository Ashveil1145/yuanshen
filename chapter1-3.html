<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chapter 1 - Let's Date, Senpai</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: black;
    font-family: 'Quicksand', sans-serif;
    color: white;
}

.background {
    position: fixed;
    width: 100%;
    height: 100vh;

    background-image: url("bg2.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    filter: none;

    z-index: -1;
}

.story-screen {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;

    padding: 30px;
}

.dialogue-box {
    width: 100%;
    min-height: 190px;

    background-color: rgba(100, 100, 100, 0.75);

    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 8px;

    padding: 25px 35px;

    display: flex;
    flex-direction: column;
    gap: 12px;
}

.speaker {
    color: #eeeeee;
    font-size: 16px;
    font-weight: bold;
}

.english {
    color: white;
    font-size: 21px;
    line-height: 1.5;
}

.chinese {
    color: #dddddd;
    font-size: 14px;
    line-height: 1.5;
}

.button-area {
    display: none;
    justify-content: flex-end;
    margin-top: 8px;
}

.next-button {
    padding: 10px 25px;

    color: white;
    background-color: #555555;

    border: 1px solid #dddddd;
    border-radius: 5px;

    font-size: 15px;
    cursor: pointer;

    transition: 0.3s;
}

.next-button:hover {
    background-color: white;
    color: black;
}

.transition-screen {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 100vh;

    background-color: #777777;

    display: none;
    justify-content: center;
    align-items: center;

    z-index: 10;
}

.transition-content {
    text-align: center;
}

.transition-text {
    color: white;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 3px;
    opacity: 0;
}

.transition-chinese {
    color: #dddddd;
    font-size: 16px;
    margin-top: 12px;
    letter-spacing: 2px;
    opacity: 0;
}

.fade-in {
    animation: fadeIn 2s forwards;
}

.fade-in .transition-chinese {
    animation: fadeIn 2s forwards;
}

.fade-out {
    animation: fadeOut 2s forwards;
}

.fade-out .transition-chinese {
    animation: fadeOut 2s forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@keyframes fadeOut {
    from {
        opacity: 1;
    }
    to {
        opacity: 0;
    }
}

</style>
</head>

<body>

<div class="transition-screen" id="transition-screen">

    <div class="transition-content">
        <p class="transition-text" id="transition-text"></p>
        <p class="transition-chinese" id="transition-chinese"></p>
    </div>

</div>

<div class="background"></div>

<div class="story-screen">

    <div class="dialogue-box">

        <p class="speaker" id="speaker">奶蛙</p>

        <p class="english" id="english"></p>

        <p class="chinese" id="chinese"></p>

        <!-- Button -->
        <div class="button-area" id="button-area">

            <button class="next-button"
            id="next-button"
            onclick="nextText()">

                Continue / 继续

            </button>

        </div>

    </div>

</div>

<script>

let page = 1;
let speed = 60;

let englishText = "";
let chineseText = "";

function typeText() {

    let englishIndex = 0;
    let chineseIndex = 0;

    document.getElementById("english").innerHTML = "";
    document.getElementById("chinese").innerHTML = "";

    document.getElementById("button-area").style.display = "none";

    let englishTimer = setInterval(function() {

        document.getElementById("english").innerHTML +=
        englishText.charAt(englishIndex);

        englishIndex++;

        if (englishIndex >= englishText.length) {

            clearInterval(englishTimer);

            let chineseTimer = setInterval(function() {

                document.getElementById("chinese").innerHTML +=
                chineseText.charAt(chineseIndex);

                chineseIndex++;

                if (chineseIndex >= chineseText.length) {

                    clearInterval(chineseTimer);

                    document.getElementById("button-area").style.display = "flex";

                }

            }, speed);

        }

    }, speed);

}

function showTransition() {

    let screen = document.getElementById("transition-screen");

    let text = document.getElementById("transition-text");

    let chinese = document.getElementById("transition-chinese");

    document.querySelector(".story-screen").style.display = "none";

    screen.style.display = "flex";

    text.innerHTML = "A Few Months Later";
    chinese.innerHTML = "几个月后";

    text.className = "transition-text fade-in";

    setTimeout(function() {

        text.className = "transition-text fade-out";

        setTimeout(function() {

            text.innerHTML = "Walking Home with a Familiar Face";
            chinese.innerHTML = "与偶遇的奶蛙一起放学";

            text.className = "transition-text fade-in";

            setTimeout(function() {

                text.className = "transition-text fade-out";

                setTimeout(function() {

                    window.location.href = "chapter1-4.html";

                }, 2000);

            }, 2500);

        }, 2000);

    }, 2500);

}

function nextText() {

    if (page == 1) {

        document.getElementById("speaker").innerHTML = "Y/N";

        englishText = "Th... thank you.";
        chineseText = "谢……谢谢。";

        page = 2;

        typeText();

    } else if (page == 2) {

        showTransition();

    }

}

englishText = "You don't seem very happy. It's okay. Keep going, senpai!";

chineseText = "你好像不太开心，没事的，加油啊前辈！";

typeText();

</script>

</body>
</html>
