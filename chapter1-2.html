<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Chapter 1 - Let's Date, Senpai</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            font-family: 'Quicksand', sans-serif;
            color: white;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100vh;

            background-image: url("bg1.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: none;

            z-index: -1;
        }

        .story-screen {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;

            padding: 30px;
        }

        .dialogue-box {
            width: 100%;
            min-height: 190px;

            background-color: rgba(0, 0, 0, 0.85);

            border: 1px solid #777777;
            border-radius: 8px;

            padding: 25px 35px;

            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .speaker {
            color: #cccccc;
            font-size: 16px;
            font-weight: bold;
        }

        .english {
            color: white;
            font-size: 21px;
            line-height: 1.5;
        }

        .chinese {
            color: #999999;
            font-size: 14px;
            line-height: 1.5;
        }

        .button-area {
            display: none;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .next-button {
            padding: 10px 25px;

            color: white;
            background-color: #333333;
            border: 1px solid #aaaaaa;
            border-radius: 5px;

            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .next-button:hover {
            background-color: white;
            color: black;
        }

    </style>

</head>

<body>

    <div class="background"></div>

    <div class="story-screen">

        <div class="dialogue-box">

            <p class="speaker" id="speaker">Y/N</p>

            <p class="english" id="english"></p>

            <p class="chinese" id="chinese"></p>

            <div class="button-area" id="button-area">

                <button class="next-button" id="next-button" onclick="nextText()">
                    Continue / 继续
                </button>

            </div>

        </div>

    </div>


    <script>

        let page = 1;

        let speed = 60;

        let englishText = "";
        let chineseText = "";

        function typeText() {

            let englishIndex = 0;
            let chineseIndex = 0;

            document.getElementById("english").innerHTML = "";
            document.getElementById("chinese").innerHTML = "";

            document.getElementById("button-area").style.display = "none";

            let englishTimer = setInterval(function() {

                document.getElementById("english").innerHTML +=
                    englishText.charAt(englishIndex);

                englishIndex++;

                if (englishIndex >= englishText.length) {

                    clearInterval(englishTimer);

                    let chineseTimer = setInterval(function() {

                        document.getElementById("chinese").innerHTML +=
                            chineseText.charAt(chineseIndex);

                        chineseIndex++;

                        if (chineseIndex >= chineseText.length) {

                            clearInterval(chineseTimer);

                            document.getElementById("button-area").style.display = "flex";

                        }

                    }, speed);

                }

            }, speed);

        }

        function nextText() {

            if (page == 1) {

                document.getElementById("speaker").innerHTML = "???";

                englishText =
                    "Y/N, what are you thinking about? Why so gloomy?";

                chineseText =
                    "Y/N，在想什么呢？怎么闷闷不乐的？";

                document.getElementById("next-button").innerHTML =
                    "Look up / 抬头看";

                page = 2;

                typeText();

            }

            else if (page == 2) {

                window.location.href = "chapter1-3.html";

            }

        }

        englishText =
            "No matter how hard I try, I'll probably always be just an ordinary person.";

        chineseText =
            "无论我再怎么努力，我大概也只会是一个平平无奇的人吧。";

        typeText();

    </script>

</body>

</html>
