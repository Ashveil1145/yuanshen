<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Chapter 1 - Let's Date, Senpai</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: black;
    font-family: 'Quicksand', sans-serif;
    color: white;
}

.background {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 100vh;

    background-image: url("bg3.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: -1;

    transition: background-image 0.5s;
}

.story-screen {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;

    padding: 30px;
}

.dialogue-box {
    width: 100%;
    min-height: 190px;

    background-color: rgba(100, 100, 100, 0.75);

    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 8px;

    padding: 25px 35px;

    display: flex;
    flex-direction: column;
    gap: 12px;
}

.speaker {
    color: #eeeeee;
    font-size: 16px;
    font-weight: bold;
}

.english {
    color: white;
    font-size: 21px;
    line-height: 1.5;
}

.chinese {
    color: #dddddd;
    font-size: 14px;
    line-height: 1.5;
}

.button-area {
    display: none;
    justify-content: flex-end;
    margin-top: 8px;
}

.next-button {
    padding: 10px 25px;

    color: white;
    background-color: #555555;

    border: 1px solid #dddddd;
    border-radius: 5px;

    font-size: 15px;
    cursor: pointer;

    transition: 0.3s;
}

.next-button:hover {
    background-color: white;
    color: black;
}

</style>
</head>


<body>
<div class="background" id="background"></div>
<div class="story-screen">

    <div class="dialogue-box">
        <p class="speaker" id="speaker">奶蛙</p>
        <p class="english" id="english"></p>
        <p class="chinese" id="chinese"></p>
        <div class="button-area" id="button-area">

            <button class="next-button"
            id="next-button"
            onclick="nextText()">

                Continue / 继续

            </button>

        </div>

    </div>

</div>


<script>
let page = 1;

let speed = 60;
let englishText = "";
let chineseText = "";

function typeText() {

    let englishIndex = 0;
    let chineseIndex = 0;
    document.getElementById("english").innerHTML = "";
    document.getElementById("chinese").innerHTML = "";
    document.getElementById("button-area").style.display = "none";
    let englishTimer = setInterval(function() {

        document.getElementById("english").innerHTML +=
        englishText.charAt(englishIndex);

        englishIndex++;
        if (englishIndex >= englishText.length) {

            clearInterval(englishTimer);

            let chineseTimer = setInterval(function() {

                document.getElementById("chinese").innerHTML +=
                chineseText.charAt(chineseIndex);

                chineseIndex++;

                if (chineseIndex >= chineseText.length) {

                    clearInterval(chineseTimer);

                    document.getElementById("button-area").style.display = "flex";

                }

            }, speed);

        }

    }, speed);

}

function changeBackground() {

    document.getElementById("background").style.backgroundImage =
    'url("bg4.jpg")';

}

function nextText() {

    if (page == 1) {

        document.getElementById("speaker").innerHTML = "Y/N";

        englishText =
        "Yeah... How was your day?";

        chineseText =
        "是啊……你今天过得怎么样？";

        document.getElementById("next-button").innerHTML =
        "Listen / 倾听";

        page = 2;

        typeText();

    }

    else if (page == 2) {
        changeBackground();

        document.getElementById("speaker").innerHTML = "奶蛙";

        englishText =
        "（说了些苦恼的话）";

        chineseText =
        "我是区吧！";

        document.getElementById("next-button").innerHTML =
        "Continue / 继续";

        page = 3;

        typeText();

    }

    else if (page == 3) {

        document.getElementById("speaker").innerHTML = "Y/N";

        englishText =
        "（说了些安慰的话）";

        chineseText =
        "你也是直接不区了好吧";

        document.getElementById("next-button").innerHTML =
        "Continue / 继续";

        page = 4;

        typeText();

    }

    else if (page == 4) {

        window.location.href = "end.html";

    }

}

englishText =
"What a coincidence, senpai! I just happened to run into you after school.";

chineseText =
"好巧啊前辈，正好碰到你放学啦。";

typeText();


</script>

</body>
</html>
