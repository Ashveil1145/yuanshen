<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Let's Date, Senpai - End</title>

<style>

/* =========================
   Basic Settings
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    min-height: 100vh;

    background-image: url("bg5.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    font-family: 'Quicksand', sans-serif;
    color: #8b4563;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    position: relative;
    text-align: center;
}

/* =========================
   Main Content
========================= */

.main-content {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 20px;

    padding: 30px;
}

/* Congratulations */

h1 {
    font-size: 48px;
    font-weight: 700;
    color: #D45D85;
}

/* Main Message */

.message {
    font-size: 25px;
    font-weight: 600;
    color: #a65c78;
}

/* Thank You */

.thank-you {
    font-size: 14px;
    color: #a67b8d;

    margin-top: 15px;
    line-height: 1.8;
}

/* =========================
   Quiz Button
========================= */

.quiz-button {
    margin-top: 20px;
    padding: 14px 35px;

    background-color: #e88aaa;
    color: white;

    border: none;
    border-radius: 30px;

    font-size: 16px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;

    cursor: pointer;
    transition: 0.3s;
}

.quiz-button:hover {
    background-color: #d45d85;
    transform: scale(1.05);
}

/* =========================
   Footer
========================= */

.footer {
    position: absolute;
    bottom: 25px;

    width: 100%;

    text-align: center;

    font-size: 12px;
    line-height: 1.8;

    color: #000000;
}

</style>
</head>

<body>

    <div class="main-content">

        <h1>Congratulations!</h1>

        <p class="message">
            You two are together!
        </p>

        <p class="thank-you">
            Special thanks to 尼古拉斯.未眠.谢列<br>
            and all our friends for their anticipation and support!
        </p>

        <!-- Quiz Button -->
        <button class="quiz-button"
        onclick="window.location.href='quiz.html'">
            We Have a Quiz!
        </button>

    </div>

    <!-- Footer -->
    <div class="footer">

        <p>test 1.0</p>

        <p>历经百战二游女（Shirley）/Nate</p>

    </div>

</body>

</html>
