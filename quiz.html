
<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Let's Date, Senpai - Quiz</title>

<style>

/* =========================
   Basic Settings
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    background-color: #FFE6EF;

    font-family: 'Quicksand', sans-serif;
    color: #A63D65;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
}

/* =========================
   Quiz Container
========================= */

.quiz-container {
    width: 90%;
    max-width: 650px;

    padding: 40px;

    background-color: rgba(255, 255, 255, 0.65);

    border-radius: 25px;

    box-shadow: 0 5px 20px rgba(180, 80, 120, 0.12);
}

/* Title */

h1 {
    font-size: 36px;
    color: #D45D85;

    margin-bottom: 35px;
}

/* Questions */

.question {
    font-size: 21px;
    font-weight: 700;

    margin-top: 25px;
    margin-bottom: 15px;
}

/* Options */

.options {
    font-size: 18px;
    margin-bottom: 20px;
}

.options label {
    margin: 0 12px;
    cursor: pointer;
}

input[type="radio"] {
    accent-color: #D45D85;
    cursor: pointer;
}

/* Textarea */

textarea {
    width: 100%;
    height: 110px;

    padding: 15px;

    border: 2px solid #E8A0BA;
    border-radius: 12px;

    background-color: #FFF8FB;

    font-family: inherit;
    font-size: 16px;

    color: #8B4563;

    resize: vertical;
    outline: none;
}

textarea:focus {
    border-color: #D45D85;
}

/* Submit Button */

.submit-button {
    margin-top: 30px;

    padding: 14px 45px;

    background-color: #E88AAA;
    color: white;

    border: none;
    border-radius: 30px;

    font-family: inherit;
    font-size: 18px;
    font-weight: 700;

    cursor: pointer;
    transition: 0.3s;
}

.submit-button:hover {
    background-color: #D45D85;
    transform: scale(1.05);
}

/* =========================
   Thank You Screen
========================= */

#thank-you-screen {
    display: none;
}

#thank-you-screen h1 {
    font-size: 42px;
    color: #D45D85;
}

#thank-you-screen p {
    font-size: 20px;
    margin-top: 20px;
    line-height: 1.8;
}

</style>
</head>


<body>

<!-- =========================
     Quiz Page
========================= -->

<div class="quiz-container" id="quiz-screen">

    <h1>Game Survey</h1>

    <form id="quiz-form">

        <!-- Question 1 -->

        <p class="question">
            1. Have you played similar games before?
        </p>

        <div class="options">

            <label>
                <input type="radio" name="experience" value="Yes" required>
                Yes
            </label>

            <label>
                <input type="radio" name="experience" value="No">
                No
            </label>

        </div>


        <!-- Question 2 -->

        <p class="question">
            2. How would you rate this game?
        </p>

        <div class="options">

            <label>
                <input type="radio" name="rating" value="1" required>
                1
            </label>

            <label>
                <input type="radio" name="rating" value="2">
                2
            </label>

            <label>
                <input type="radio" name="rating" value="3">
                3
            </label>

            <label>
                <input type="radio" name="rating" value="4">
                4
            </label>

            <label>
                <input type="radio" name="rating" value="5">
                5
            </label>

        </div>


        <!-- Question 3 -->

        <p class="question">
            3. Do you have any suggestions for improvement?
        </p>

        <textarea
            name="suggestions"
            placeholder="Write your suggestions here..."
        ></textarea>


        <!-- Submit Button -->

        <button type="submit" class="submit-button">
            Submit
        </button>

    </form>

</div>


<!-- =========================
     Thank You Page
========================= -->

<div class="quiz-container" id="thank-you-screen">

    <h1>Thank You for Playing!</h1>

    <p>
        We hope you enjoyed the game!
    </p>

    <p>
        Your feedback means a lot to us!
    </p>

    <!-- Back to Home Button -->
    <button class="submit-button"
    onclick="window.location.href='index.html'">
        Back to Home
    </button>

</div>


<!-- =========================
     JavaScript
========================= -->

<script>

document.getElementById("quiz-form").addEventListener("submit", function(event) {

    event.preventDefault();

    // Hide Quiz Screen
    document.getElementById("quiz-screen").style.display = "none";

    // Show Thank You Screen
    document.getElementById("thank-you-screen").style.display = "block";

});

</script>

</body>
</html>
